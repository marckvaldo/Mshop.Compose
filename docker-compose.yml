  MShop.loki.dev:
    hostname: loki
    image: grafana/loki:3.6.7
    ports:
      - 3100:3100
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - ./loki/data:/loki
    command: ['-config.file=/etc/loki/config.yaml']
    restart: unless-stopped
    networks:
      - app-catalago

  MShop.Grafana.dev:
    hostname: grafana
    image: grafana/grafana:12.4.0
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=508197
    volumes:
    #  - ./grafana/provisioning/datasources/default.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
      - ./grafana/provisioning/dashboards/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - app-catalago
  
  MShop.Alloy.dev:
    container_name: alloy
    hostname: alloy
    image: grafana/alloy:v1.12.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - 12345:12345   #admin/debug
      - 4317:4317     #gRPC
      - 4318:4318     #HTTP
    volumes:
      - ./alloy/alloy-config.alloy:/etc/alloy/config.alloy:ro
      #- /var/run/docker.sock:/var/run/docker.sock:ro // logs do docker
    restart: unless-stopped
    networks:
      - app-catalago

  MShop.Tempo.dev:
    image: grafana/tempo:2.7.2
    hostname: tempo
    ports:
      - "3200:3200"
    #  - "4319:4317"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo
    restart: unless-stopped
    networks:
      - app-catalago
  
  MShop.Prometheus.dev:
    image: prom/prometheus:v3.5.0
    hostname: prometheus
    ports:
      - 9090:9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus/data
    restart: unless-stopped
    networks:
      - app-catalago

volumes:
  elasticsearch:

networks:
  app-catalago:
    external: true