server:
  http_listen_port: 3200

#aqui eu falo que os dados cerao recebido nas portas 4317 and 4318
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

#aqui linpo os blocos a cada 5 minutos
ingester:
  max_block_duration: 5m

#aqui guarda a informações por 7 dias
compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local

    wal:
      path: /tmp/tempo/wal

    local:
      path: /tmp/tempo/traces

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

#aqui eu defino que o tempo precisa as consultas de devem ser concluidas em ate 5s
#aqui tambem eu defino a mesma coisa para os trace
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1073741824
  trace_by_id:
    duration_slo: 5s

#aqui estou falando para iniciar mesmo quando o cluter não estiver funcinando 
memberlist:
  abort_if_cluster_join_fails: false
  bind_port: 7946

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

#Tempo	Valor
#24 horas	24h
#7 dias	168h
#15 dias	360h
#30 dias	720h