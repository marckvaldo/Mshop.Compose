receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  elasticsearch:
    #endpoints: ["http://MShop.Elasticsearch.dev:9200"]
    #auth:
    #  username: elastic
    #  password: elasticpassword
    endpoints: ["http://elastic:elasticpassword@MShop.Elasticsearch.dev:9200"]

    logs_index: "otel-logs"
    traces_index: "otel-traces"
    #metrics_index: "otel-metrics"


  otlp/jaeger:
    endpoint: MShop.jaeger.dev:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]

#    metrics:
#      receivers: [otlp]
#      processors: [batch]
#      exporters: [elasticsearch]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]
